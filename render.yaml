services:
  - type: web
    name: clustro-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:api && npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
